name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7b1c307e0dcbda6122208f10795a713336a9b35a # @stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaff # v2.7.5

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check advisories, licenses, bans and sources
        run: cargo deny check

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # 2.0.0
        with:
          scandir: "./scripts"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Build (wasm32 target)
        run: cargo build --workspace --target wasm32v1-none --release

      - name: Check wasm binary size
        run: bash scripts/check-wasm-size.sh

      - name: Test
        run: cargo test --workspace

      - name: Hash and upload wasm artifacts
        if: github.ref == 'refs/heads/main'
        run: |
          cd target/wasm32v1-none/release
          sha256sum ./*.wasm | tee wasm.sha256
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat wasm.sha256 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload wasm artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: contracts-wasm
          path: |
            target/wasm32v1-none/release/*.wasm
            target/wasm32v1-none/release/wasm.sha256

  docs-check:
    name: Check docs links and spelling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check links
        uses: lycheeverse/lychee-action@7cd0af4c74a61395d455af97419279d86aafaede # v1.10.0
        with:
          args: --no-progress "**/*.md"

      - name: Check spelling
        uses: streetsidesoftware/cspell-action@934c74da3775ac844ec89503f666f67efb427fed # v6.8.1
        with:
          config: .cspell.json
          files: "**/*.md"
